services:
  - type: web
    name: casa-companion-demo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AZURE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
